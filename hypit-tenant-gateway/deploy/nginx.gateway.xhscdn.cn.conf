limit_req_zone $binary_remote_addr zone=hypit_gateway_login:10m rate=10r/m;

upstream hypit_tenant_gateway_upstream {
    server 127.0.0.1:8791;
    keepalive 16;
}

server {
    listen 80;
    server_name gateway.xhscdn.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gateway.xhscdn.cn;

    ssl_certificate /etc/letsencrypt/live/xhscdn.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xhscdn.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/hypit-tenant-gateway.access.log;
    error_log /var/log/nginx/hypit-tenant-gateway.error.log;
    client_max_body_size 64m;

    location = /api/auth/login {
        limit_req zone=hypit_gateway_login burst=5 nodelay;
        proxy_pass http://hypit_tenant_gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://hypit_tenant_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
